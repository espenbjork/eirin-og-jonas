<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Takk for hilsenene – Eirin &amp; Jonas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root {
    --krem: #fbf8f1;
    --krem-dyp: #f4eee0;
    --salvie: #7d977d;
    --salvie-dyp: #5c755c;
    --salvie-lys: #aabfa8;
    --gull: #b9974e;
    --gull-lys: #d4bc82;
    --blekk: #4a5348;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 20%, #fffdf7 0%, var(--krem) 55%, var(--krem-dyp) 100%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--blekk);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 48px;
  }
  .topp { text-align: center; margin-bottom: 26px; }
  .initialer {
    font-family: 'Parisienne', cursive;
    font-size: 4rem;
    line-height: 1;
    color: var(--gull);
  }
  .initialer .amp { font-size: 0.45em; color: var(--salvie); vertical-align: 12%; }
  .undertittel {
    font-style: italic;
    font-size: 1.2rem;
    color: var(--salvie-dyp);
    margin-top: 6px;
  }
  .kort {
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,253,0.9);
    border: 1px solid rgba(170,191,168,0.5);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: 0 6px 26px rgba(92,117,92,0.12);
  }
  label {
    display: block;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--salvie-dyp);
    margin-bottom: 6px;
  }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1.15rem;
    color: var(--blekk);
    background: #fffefb;
    border: 1px solid var(--salvie-lys);
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, textarea:focus {
    border-color: var(--gull);
    box-shadow: 0 0 0 3px rgba(185,151,78,0.15);
  }
  textarea { resize: none; height: 110px; margin-bottom: 4px; }
  .teller { text-align: right; font-size: 0.9rem; color: var(--salvie); margin-bottom: 16px; }
  .felt { margin-bottom: 18px; }
  button.send {
    width: 100%;
    font-family: inherit;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #fffdf7;
    background: linear-gradient(135deg, var(--salvie) 0%, var(--salvie-dyp) 100%);
    border: none;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button.send:active { transform: scale(0.98); }
  button.send:disabled { opacity: 0.55; cursor: default; }

  .emoji-tittel {
    text-align: center;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--salvie-dyp);
    margin: 26px 0 12px;
  }
  .emoji-rad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 460px;
  }
  .emoji-rad button {
    font-size: 2rem;
    background: rgba(255,255,253,0.9);
    border: 1px solid rgba(170,191,168,0.5);
    border-radius: 14px;
    padding: 12px 0;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(92,117,92,0.08);
    transition: transform 0.12s;
  }
  .emoji-rad button:active { transform: scale(1.15); }

  .kvittering {
    position: fixed;
    left: 50%; bottom: 30px;
    transform: translateX(-50%) translateY(120px);
    background: var(--salvie-dyp);
    color: #fffdf7;
    font-size: 1.15rem;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 26px rgba(74,83,72,0.3);
    transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    z-index: 10;
    text-align: center;
  }
  .kvittering.vis { transform: translateX(-50%) translateY(0); }
  .kvittering.advarsel { background: #b07a52; }
  .fot {
    margin-top: 34px;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--salvie);
    text-align: center;
  }
  .kort p { font-size: 1.25rem; line-height: 1.5; text-align: center; }
  .kort p + p { margin-top: 14px; }
</style>
</head>
<body>

<div class="topp">
  <div class="initialer">E<span class="amp">&amp;</span>J</div>
  <div class="undertittel">Takk for alle hilsenene 💌</div>
</div>

<div class="kort">
  <p>Hilsenene til storskjermen ble samlet inn under bryllupet 11. juli 2026, og innsendingen er nå stengt.</p>
  <p>Takk til alle som sendte en hilsen til Eirin &amp; Jonas!</p>
</div>

<script>
  // Fjern navn og eventuelle usendte hilsener som gjestesiden lagret i nettleseren.
  try { localStorage.removeItem("ej_navn"); localStorage.removeItem("ej_kø"); } catch (e) {}
</script>
</body>
</html>
